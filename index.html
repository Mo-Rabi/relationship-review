}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(() =&gt; {

    visits:{title:&#x27;زيارة الأهل والمبيت&#x27;,category:&#x27;اتفاقات وحدود&#x27;,facts:[&#x27;أهلها على بُعد نحو ٧٠–٨٠ كم؛ الزيارات تحتاج وقتًا وترتيبًا.&#x27;,&#x27;أمها كانت تزوركم وتبيت؛ وأنت كنت توصل زوجتك أحيانًا، وتكلمت مع أخيها أحمد ليأخذها.&#x27;,&#x27;بحسب توضيحك الأخير: كانت تصر أن تتولى أنت الذهاب والعودة، وأن تكون الزيارة للأم فقط دون الأب القريب منها، رغم ضيق وقتك.&#x27;],claude:[&#x27;بدأ باعتبار موقفك منعًا لصلة الرحم.&#x27;,&#x27;بعد التوضيح أقرّ بوجود زيارات، ثم جزم بأنها تشعر بالاختناق وعدم الإنصاف.&#x27;],verdict:&#x27;المعطيات لا تصف منعًا كاملًا من الأهل. وفّرت بدائل للزيارة، بينما كان الخلاف على وسيلة التوصيل، والمبيت، وزيارة الأم دون الأب. هذا يغيّر وزن الاستنتاج بأنك كنت تقطع الصلة.&#x27;,unknown:&#x27;غير محسوم: هل كانت البدائل متاحة عمليًا في كل مرة؟ وهل كان هناك ترتيب متفق عليه لزيارة الأب أو سبب محدد لرفضها؟&#x27;,lesson:&#x27;في الزواج القادم: اتفقا مسبقًا على من يوصّل عند انشغالك، وأوقات الزيارة، وحق كل طرف في صلة أهله دون تحويل أحد الوالدين إلى خصم.&#x27;,question:&#x27;هل كانت ترفض زيارة الأب من موقف شخصي منها، أم خوفًا من رد فعل الأم، أم لسبب آخر لم يُناقش بينكما؟&#x27;},
    movement:{title:&#x27;الخروج والمرافقة&#x27;,category:&#x27;ثقة وأمان&#x27;,facts:[&#x27;اشترطت في البداية مرافقتها للجيم القريب وبعض المشاوير.&#x27;,&#x27;ربطت ذلك بالخوف عليها، وطرحت احتمال رغبتها في الاختلاط.&#x27;,&#x27;وضّحت لاحقًا أنها أصبحت تذهب للجيم وتشتري وحدها.&#x27;],claude:[&#x27;جزم بأن المرافقة سبب اختناقها وأن الخوف مجرد غطاء للتحكم.&#x27;,&#x27;اعتبر السماح اللاحق حرية وصلت متأخرة ومتسممة.&#x27;],verdict:&#x27;الاشتراط قد يضيّق حركتها، لكن أثره وسبب تغييره يحتاجان سياقًا. رغبتها في الخروج وحدها ليست دليلًا على سوء نية.&#x27;,unknown:&#x27;غير محسوم: مخاطر الطريق، والاتفاق بينكما، وما تغير فعليًا بعد السماح.&#x27;,lesson:&#x27;قيّم خطر المشوار نفسه، وافصل عرض المساعدة عن إلزام المرافقة؛ دون اتهام للنوايا.&#x27;,question:&#x27;ما الخطر المحدد، وما الترتيب المتناسب معه الذي يقبله الطرفان؟&#x27;},
    conflict:{title:&#x27;الزعيق وطلب التهدئة&#x27;,category:&#x27;إدارة خلاف&#x27;,facts:[&#x27;قلت إنك تطلب مهلة من أول بادرة خلاف، وأحيانًا تخرج لتهدأ.&#x27;,&#x27;بحسب روايتك، كانت تستمر في الصراخ ولا تحترم المهلة.&#x27;,&#x27;اعترفت بأنك قد تنفعل في النهاية ويعلو صوتك.&#x27;],claude:[&#x27;افترض أولًا أنك تؤخر المهلة أو تستخدم نبرة متعالية.&#x27;,&#x27;تراجع بعد التصحيح، لكنه جزم بتفسير نفسي لسلوكها.&#x27;],verdict:&#x27;طلب المهلة المبكر خطوة مفيدة. رفض المهلة والزعيق يحتاجان تقييمًا مستقلًا لكل طرف؛ النية والنبرة لا تُستنتجان من النص وحده.&#x27;,unknown:&#x27;غير محسوم: موعد العودة للحوار، وما يحدث بعد العودة، وتكرار كل سلوك.&#x27;,lesson:&#x27;اتفاق على مهلة واضحة وعودة محددة، دون مطاردة أو إهانة أو تخويف من أي طرف.&#x27;,question:&#x27;هل كانت المهلة تنتهي بحوار وحل، أم كان الخلاف يستأنف بنفس الصورة؟&#x27;},
    weapon:{title:&#x27;التهديد بالسكينة&#x27;,category:&#x27;سلامة&#x27;,facts:[&#x27;ذكرت رفع سكينة والتهديد بإيذائك أثناء محاولة الخروج.&#x27;,&#x27;وضّحت أنها لم تحاول طعنك، وأنك أخذتها منها بهدوء وكانت تبكي.&#x27;],claude:[&#x27;أخذ التهديد بجدية أولًا.&#x27;,&#x27;بعد التوضيح جزم بأنه انهيار ويأس، واستدل بالبكاء على طيبتها.&#x27;,&#x27;كرر الحث على ستر الواقعة.&#x27;],verdict:&#x27;التهديد بالسلاح مؤذٍ وخطير حتى دون إصابة. البكاء وعدم محاولة الطعن لا يثبتان النية ولا يضمنان الأمان.&#x27;,unknown:&#x27;غير محسوم: تفاصيل الخطر واحتمال تكراره؛ لا يمكن تقديرهما من هذا الحوار وحده.&#x27;,lesson:&#x27;الأمان أولًا؛ الاستعانة بشخص موثوق أو مختص والإفصاح اللازم للحماية يختلف عن التشهير.&#x27;,question:&#x27;ما الترتيب الذي يحميك من تكرار موقف خطر، مستقلًا عن أي قرار بالرجوع؟&#x27;},
    care:{title:&#x27;طلب المساعدة النفسية&#x27;,category:&#x27;احتياج ومسؤولية&#x27;,facts:[&#x27;قلت إنها سبق أن راجعت طبيبًا نفسيًا وطلبت مساعدة مجددًا.&#x27;,&#x27;ذكرت قلقك من تكلفة العلاج ووقت التوصيل.&#x27;],claude:[&#x27;جزم بجرح هجر وبأن العلاج كان يمكن أن ينقذ البيت.&#x27;,&#x27;حمّل قرار عدم العلاج وزنًا سببيًا كبيرًا دون تقييم مباشر.&#x27;],verdict:&#x27;طلب المساعدة يستحق الجدية. لا نعرف التشخيص، ولا نستطيع ضمان أن العلاج كان سيمنع الانفصال.&#x27;,unknown:&#x27;غير محسوم: نوع العلاج السابق، مدته، سبب توقفه، والبدائل التي كانت متاحة.&#x27;,lesson:&#x27;بحث دعم مناسب للإمكانات مع مختص؛ الزوج شريك داعم وليس بديلًا عن العلاج أو ضامنًا لنجاحه.&#x27;,question:&#x27;ما الدعم الذي طُلب تحديدًا، وما الخيارات الواقعية التي كانت متاحة؟&#x27;},
    family:{title:&#x27;تدخل الأم وخلاف الوالدين&#x27;,category:&#x27;حدود الأسرة&#x27;,facts:[&#x27;بحسب روايتك، أمها كانت تضغط بخصوص المبيت وتحكي لها خلافاتها.&#x27;,&#x27;طلبت من أمها عدم تحميلها هذه المشاكل.&#x27;,&#x27;ذكرت طلب زوجتك أن تصطف مع أمها ضد أبيها، وأن الزيارة المطلوبة كانت للأم وحدها رغم قرب الأب.&#x27;],claude:[&#x27;أقر بالتدخل، ثم جزم بأنه زرع فيها جرحًا ومشروع انتقام.&#x27;,&#x27;افترض أن تغيير نظامك كان سيعطل أثر تدخل الأم.&#x27;],verdict:&#x27;تدخل الأم وضغطها على ابنتها قد يكون عاملًا كبيرًا، خصوصًا إذا حوّل زيارات الأهل إلى اصطفاف ضد الأب. لكنه لا يثبت وحده أنها «تسيطر على البيت»؛ ذلك يحتاج أمثلة على قرارات بيتكما التي فُرضت فعليًا بسببها.&#x27;,unknown:&#x27;غير محسوم: ما القرار المحدد في بيتكما الذي تغير فقط لأن الأم أرادته؟ وما الذي نُقل حرفيًا؟&#x27;,lesson:&#x27;حدود ثابتة مع الأسرتين: لا تستعمل الزوجة مشاكل والديها في إدارة بيتها، ولا يُطلب من الزوج أن يختار طرفًا في خصوماتهم.&#x27;,question:&#x27;ما أمثلة القرارات التي اتخذتها زوجتك في بيتكما ضد اتفاقكما بسبب طلب مباشر من أمها؟&#x27;},
    privacy:{title:&#x27;تفتيش الهاتف والشك&#x27;,category:&#x27;ثقة وخصوصية&#x27;,facts:[&#x27;ذكرت أنها كانت تفتش هاتفك وتطلب تفاصيل تحركاتك.&#x27;,&#x27;ذكرت أنت خوفك من الخيانة واستشهدت بقصص منتشرة على الإنترنت.&#x27;],claude:[&#x27;فسّر سلوكها برعب الهجر وسلوكك باضطراب القلق.&#x27;,&#x27;استخدم أعدادًا وقصصًا غير متحققة لتقدير مدى انتشار الخيانة.&#x27;],verdict:&#x27;الرقابة والاتهام بلا دليل يستحقان المراجعة من الطرفين. القصص لا تكفي لإثبات نية شخص أو تقدير نسبة انتشار ظاهرة.&#x27;,unknown:&#x27;غير محسوم: وجود وقائع محددة أضرّت بالثقة، أو اتفاق سابق حول الخصوصية.&#x27;,lesson:&#x27;اتفاق متبادل على الخصوصية والتواصل؛ التعامل مع الوقائع بدل التحقيق الدائم أو الظنون.&#x27;,question:&#x27;أي طلب للاطمئنان متبادل ومقبول، وأي طلب يتحول إلى مراقبة؟&#x27;},
    time:{title:&#x27;الشغل والوقت والاتفاقات&#x27;,category:&#x27;توافق يومي&#x27;,facts:[&#x27;كنت تبني شركة وتعمل نحو ١٠–١٢ ساعة يوميًا.&#x27;,&#x27;قلت إنك أعلنت ضغط العمل والسكن في محافظة أخرى قبل الزواج.&#x27;,&#x27;ذكرت قعدات مشتركة وخروجات محلية وقربًا بينكما.&#x27;],claude:[&#x27;افترض أولًا أنك لم تخصص وقتًا للبيت وأنها تعيش وحدها طوال الوقت.&#x27;,&#x27;بعد التوضيح أقر بالإعلان المسبق، مع استمرار الجزم بالتوقيت الخاطئ.&#x27;],verdict:&#x27;وضوحك المسبق يُحسب لك. قبولها الأول لا يضمن أن الترتيب سيظل مريحًا؛ وجود وقت مشترك يحتاج وصفًا واقعيًا.&#x27;,unknown:&#x27;غير محسوم: مقدار الوقت وجودته، واحتياجات كل طرف، وما جُرّب لتعديل الجدول.&#x27;,lesson:&#x27;اتفاق على وقت مشترك قابل للتنفيذ، ومراجعة الاحتياجات بدل الاعتماد على موافقة عامة قديمة.&#x27;,question:&#x27;كيف يبدو أسبوع عادي فيه شغل وبيت وأهل وراحة لكل واحد؟&#x27;},
    spending:{title:&#x27;المصاريف والمقارنات&#x27;,category:&#x27;احتياجات وميزانية&#x27;,facts:[&#x27;شكوت من المقارنة بالصديقات والبلوجرز وكثرة طلبات الشراء والفسح.&#x27;,&#x27;قلت إنك تعرض بدائل قريبة تناسب الوقت والميزانية.&#x27;,&#x27;عرضت رحلة كمكافأة على مراجعة القرآن؛ ففهمتها هي كمساومة.&#x27;],claude:[&#x27;قلب طرفي طلب الفسح أولًا، ثم عدّل فهمه.&#x27;,&#x27;فسّر الشراء بجوع عاطفي وشراء قهري دون معلومات كافية.&#x27;],verdict:&#x27;المقارنات قد تكون جارحة، لكن طلب الشراء وحده لا يثبت اضطرابًا أو دافعًا عاطفيًا محددًا. النية الطيبة للمكافأة لا تضمن تقبّلها.&#x27;,unknown:&#x27;غير محسوم: الميزانية، وتكرار الطلبات، وما هو أساسي أو اختياري، وتاريخ الوعود.&#x27;,lesson:&#x27;ميزانية معلنة ومساحة للترفيه؛ فصل الاحتياجات الأساسية والعطاء العادي عن المكافآت الاختيارية.&#x27;,question:&#x27;ما الطلب الذي تجاوز القدرة فعلًا، وكيف اتفقتما على الأولويات؟&#x27;},
    religion:{title:&#x27;القرآن والتوافق الديني&#x27;,category:&#x27;صدق وتوافق&#x27;,facts:[&#x27;قلت إنها أعلنت حفظ عشرة أجزاء، ثم لاحظت أخطاء في القراءة.&#x27;,&#x27;ذكرت ضعف رغبتها في المراجعة أو حضور حلقاتك.&#x27;,&#x27;طلبت توافقًا واضحًا حول الطاعة والقرار في البيت.&#x27;],claude:[&#x27;فسّر الرفض بالاختناق، ثم رجّح الكذب واعتبره لاحقًا حقيقة ثابتة.&#x27;,&#x27;قدّم أحكامًا فقهية بصيغ قطعية أوسع من التوثيق المعروض.&#x27;],verdict:&#x27;ضعف القراءة يبرر الاستيضاح عن مستوى الحفظ؛ لا يثبت وحده تعمد الخداع. التوافق الديني أوسع من المظهر أو إجابة واحدة.&#x27;,unknown:&#x27;غير محسوم: معنى الحفظ وقت التصريح، والمراجعة السابقة، وأسباب ضعف القراءة أو رفض الحلقة.&#x27;,lesson:&#x27;تحقق محترم من المهارات المهمة لك، واتفاق على التطبيق اليومي للقيم؛ والمسائل المختلف فيها تُسأل فيها جهة موثوقة.&#x27;,question:&#x27;ما الذي قيل صراحة عن الحفظ، وما المتوقع عمليًا من كل طرف في الحياة الزوجية؟&#x27;},
    intimacy:{title:&#x27;الرغبات والحدود الجنسية&#x27;,category:&#x27;تراضي واحترام&#x27;,facts:[&#x27;ذكرت رغبتك في ممارسة معينة، وأنك ضغطت عليها أحيانًا لتقبلها.&#x27;,&#x27;كان القرب الجسدي موجودًا في العلاقة بحسب كلامك.&#x27;],claude:[&#x27;رفض تقديم خطة للضغط عليها، وأكد احترام الرفض.&#x27;,&#x27;ربط الأمان العاطفي بالانفتاح الجنسي بصيغة توحي بنتيجة شبه مضمونة.&#x27;],verdict:&#x27;الرغبة في التوافق مفهومة؛ الضغط على ممارسة غير مرغوبة مؤذٍ. تحسن العلاقة لا يضمن قبول ممارسة بعينها.&#x27;,unknown:&#x27;غير محسوم: حدودها التي عبّرت عنها، وأسباب عدم القبول، ومدى فهم كل طرف للآخر.&#x27;,lesson:&#x27;حوار محترم بلا إلحاح أو عقاب على الرفض؛ التوافق لا يعني موافقة مفتوحة على كل رغبة.&#x27;,question:&#x27;هل تستطيع تقبّل أن بعض رغباتك قد لا تصبح رغبات مشتركة؟&#x27;},
    attraction:{title:&#x27;القبول وبسنت&#x27;,category:&#x27;اختيار شخصي&#x27;,facts:[&#x27;وصفت قبولًا أوليًا ثم ترددًا أثناء القعدة، مع ملامح أعجبتك.&#x27;,&#x27;طلبت لقاءً ثانيًا لتتأكد، ثم أوضحت رفض والدها بسبب الوضع المعلق وعدم الوضوح.&#x27;,&#x27;أغلقت الموضوع لاحقًا وقلت إن جمالها لم يشدك بما يكفي.&#x27;],claude:[&#x27;انتقل من التحذير القطعي من القبول المتردد إلى الجزم بأن قبولك محسوم.&#x27;,&#x27;فسّر ترددك بالقلق، ودفعك للرجوع إليها، وافترض إمكانية فتح الباب مجددًا.&#x27;],verdict:&#x27;القبول يخصك ولا يحسمه المساعد من وصف ملامح. إجابات التعارف مؤشرات أولية، وليست اجتيازًا مضمونًا لاختبار زواج.&#x27;,unknown:&#x27;غير محسوم: مشاعرك المستقرة بعد التعارف، واستعدادها هي وأهلها للاستمرار.&#x27;,lesson:&#x27;وقت معقول للحكم دون إطالة مرهقة؛ تحرٍّ واقعي واحترام الرفض، بلا افتراض أنك ملزم بمرشحة بعينها.&#x27;,question:&#x27;هل يوجد ميل وارتياح كافيان عندك، أم تحاول إقناع نفسك بمزايا على الورق؟&#x27;},
    status:{title:&#x27;الوضع الزوجي والحقوق&#x27;,category:&#x27;وضوح وإثبات&#x27;,facts:[&#x27;كان الزواج الأول قائمًا مع انفصال في السكن وقت التعارف الجديد.&#x27;,&#x27;ذكرت لاحقًا أن عدم وضوحك أثّر على موقف أسرة بسنت.&#x27;,&#x27;سألت عن النشوز والخلع والذهب ومحضر إثبات الحالة.&#x27;,&#x27;آخر موقف معلن: تأجيل الزواج الجديد وترتيب العمل والأمر القائم.&#x27;],claude:[&#x27;أصاب في ضرورة الصدق وعدم مساواة طلب الطلاق بالخلع.&#x27;,&#x27;أعطى مواعيد متوقعة للإنهاء وصيغًا قانونية تحتاج مراجعة مستقلة.&#x27;,&#x27;خلط في بعض الكلام عن استرداد الذهب عند الخلع.&#x27;],verdict:&#x27;الصدق في الحالة الفعلية أساسي. استحقاق المال ومسار الانفصال مسائل تعتمد على الوقائع والمستندات؛ ليست نسب لوم في محادثة.&#x27;,unknown:&#x27;غير محسوم: المستندات والإجراءات الحالية، وطبيعة المهر المثبت، وطلبات الطرفين.&#x27;,lesson:&#x27;وصف الوضع كما هو؛ تنظيم الوقائع مع محامي أسرة، وفصل حماية الحقوق عن الانتقام أو إرضاء المساعد.&#x27;,question:&#x27;ما الإجراء الذي تم فعلًا، وما الذي ما زال نية أو احتمالًا؟&#x27;},
    generalization:{title:&#x27;تعميم الدروس على البنات&#x27;,category:&#x27;دليل وحدود&#x27;,facts:[&#x27;اقترحت تجنب بنت أمها مطلقة، وافتراض تشابهها مع بيئتها.&#x27;,&#x27;اقترحت تقليل وزن المميزات ومضاعفة العيوب بنسب ثابتة.&#x27;],claude:[&#x27;اعترض على الحتمية، لكنه استند إلى معلومة خاطئة عن أسرة بسنت.&#x27;,&#x27;سبق أن بالغ هو في ربط سن ١٩ وانفصال الأهل بسلوك متوقع.&#x27;],verdict:&#x27;صحة الاعتراض على التعميم لا تصحح مثالًا خاطئًا. لا توجد في الحوار أدلة تبرر معاملات ٥٠٪ أو ×٤ أو حكمًا على أخلاق بنت بسبب طلاق أمها.&#x27;,unknown:&#x27;غير محسوم: أثر البيئة على الشخص المعين؛ يحتاج ملاحظة لسلوكه الحالي وحدوده.&#x27;,lesson:&#x27;وزن السلوك بشدته وتكراره والاستجابة لإصلاحه؛ البيئة موضوع فحص، وليست حكمًا أخلاقيًا جاهزًا.&#x27;,question:&#x27;هل المعيار يكشف سلوكًا فعليًا، أم يستبعد شخصًا بسبب ظرف لم يختره؟&#x27;}
  };
  const criteria = {
    safety:{title:&#x27;الأمان وقت الخلاف&#x27;,wanted:&#x27;خلاف يمكن إيقافه واستكماله دون تهديد أو تخويف.&#x27;,ask:&#x27;لو واحد فينا طلب وقت يهدأ، نرجع للكلام إمتى وإزاي؟&#x27;,evidence:&#x27;احترام المهلة، والعودة للحوار، والاعتذار وإصلاح الضرر في مواقف فعلية.&#x27;,insufficient:&#x27;وصف النفس بالهدوء، أو وعد بالتغيير بعد تهديد خطير.&#x27;,own:&#x27;طلب المهلة دون إهانة، والعودة في موعد واضح، واحترام المسافة الآمنة للطرفين.&#x27;},

    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
